<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bai 2</title>
  <style>
    section {
      text-align: center;
      margin: 30px;
      background-color: rgb(233, 229, 229);
      font-family: Helvetica, sans-serif;
      font-size: 16px;
      padding: 50px 20px;
      width: 700px;
      margin: 20px auto;
    }

    .email {
      color: rgb(0, 162, 255);
    }

    span{
      color: #5ac6d0;
      border: 2px solid #5ac6d0;
      border-radius: 50%;
      padding: 10px;
    }

    .get {
      font-size: 40px;
      font-weight: bold;
    }

    input {
      padding: 20px;
      border: none;
      width: 300px;
    }

    button {
      padding: 20px 30px;
      background-color: rgba(0, 183, 255, 0.986);
      color: white;
      border: none;
      border-radius: 5%;
    }
    button:hover {
      background-color: red;
    }
  </style>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>
  <section>
    <p class="email">
      <span class="material-symbols-outlined">mail</span>
    </p>
    <p class="get">Get the Invite</p>
    <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit varius malesuada nisi ut lobortis.</p>
    <p>
      <input type="email" placeholder="Enter Email">
    </p>
    <p class="btn">
      <button type="submit">REQUEST INVITE</button>
    </p>
  </section>
</body>
</html>
