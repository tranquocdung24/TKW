<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bai 7</title>
  <style>
    nav {
      margin: 30px auto;
      font-family: Arial, Helvetica, sans-serif;
      width: 1130px;
      position: relative;
    }
    img {
      float: left;
    }
    ul {
      float: left;
      margin-left: 0;
      padding-left: 0;
    }
    li {
      display: inline-block;
      list-style: none;
      margin: 0 15px;
      font-size: 14px;
    }
    li a {
      text-decoration: none;
      color:black;
    }
    button {
      background-color: white;
      border: 2px solid rgb(182, 180, 180);    
      padding: 10px 20px;  
      border-radius: 4px;    
      font-size: 15px;
      cursor: pointer;
      position: absolute;
      right: 0;
    }
    button:hover{
      border: #0ce0cf 2px solid;
    }
  </style>
</head>
<body>
  <nav>
    <img src="image.png" alt="">
    <ul>
      <li><a href="#" style="color: #0ce0cf">Home</a></li>
      <li><a href="#">Features</a></li>
      <li><a href="#">Domain</a></li>
      <li><a href="#">Hosting</a></li>
      <li><a href="#">Pricing</a></li>
      <li><a href="#">Testimonials</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
    <button type="submit">Customer Login</button>
  </nav>
</body>
</html>
