  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
    }
    .best-share {
      text-align: center;
    }
    .logo {
      margin-bottom: 0;
    }
    h2 {
      margin-top: 12px;
    }
    strong {
      color: rgb(0, 162, 255);
    }

    .content {
      padding-bottom: 12px;
    }
    ul {
      list-style: none;
    }

    ul li {
      display: inline;

      border-radius: 5px;

    ul li a {
      color: white;

       cursor: pointer;

  <section class="best-share">

</html>
